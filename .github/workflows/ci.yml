name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Lint, Format & Test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-key-for-ci-testing-purposes
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      REDIS_URL: redis://localhost:6379
      RESEND_API_KEY: re_dummy_ci_key
      RESEND_FROM: test@example.com

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 3. Install dependencies (Clean Install)
        run: npm ci

      - name: 4. Generate Prisma Client
        run: npx prisma generate

      - name: 5. Verify code formatting
        run: npm run format:check

      - name: 6. Run ESLint code analysis
        run: npm run lint

      - name: 7. Run automated test suite
        run: npm test

  # -------------------------------------------------
  # CD Job – Deploy to EC2 (runs after CI succeeds)
  # -------------------------------------------------

  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: validate-and-test # ensures CI passed before deployment
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
    steps:
      - name: Checkout repository (again for deployment)
        uses: actions/checkout@v4

      - name: Set up SSH key for remote access
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/medo_production.pem
          chmod 600 ~/.ssh/medo_production.pem
          ssh-keyscan -H $(echo $EC2_HOST | cut -d'@' -f2) >> ~/.ssh/known_hosts

      - name: Install rsync (usually pre‑installed)
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Upload backend code to EC2
        run: |
          rsync -avz \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude 'test' \
            --exclude 'coverage' \
            --exclude 'logs' \
            --exclude '*.log' \
            -e "ssh -i ~/.ssh/medo_production.pem" \
            ./ $EC2_HOST:~/galleries_manager

      - name: Provision server (Node.js + Redis)
        run: |
          ssh -i ~/.ssh/medo_production.pem $EC2_HOST << 'EOF'
            set -e

            # 1. Update the OS packages (Ubuntu uses apt)
            sudo apt-get update -y

            # 2. Install nvm (Node Version Manager)
            curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash

            # 3. Load nvm into the current shell
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 4. Install and activate Node.js v22
            nvm install 22
            nvm alias default 22
            nvm use 22

            # 5. Verify
            node -v
            npm -v

            # 6. Install Redis
            sudo apt-get install -y redis-server
            sudo systemctl enable redis-server
            sudo systemctl start redis-server
          EOF

      - name: Install dependencies, run Prisma, and restart service
        run: |
          ssh -i ~/.ssh/medo_production.pem $EC2_HOST << EOF
            set -e

            # Load nvm (not loaded by default in non-interactive SSH)
            export NVM_DIR="\$HOME/.nvm"
            [ -s "\$NVM_DIR/nvm.sh" ] && \\. "\$NVM_DIR/nvm.sh"

            cd ~/galleries_manager

            # Export environment variables for Prisma and the app
            export DATABASE_URL="${DATABASE_URL}"
            export JWT_SECRET="${JWT_SECRET}"
            export REDIS_URL="${REDIS_URL}"
            export RESEND_API_KEY="${RESEND_API_KEY}"
            export RESEND_FROM="${RESEND_FROM}"
            export NODE_ENV=production

            # 1. Install production dependencies only
            npm ci --omit=dev

            # 2. Generate Prisma Client (required before the app can start)
            npx prisma generate

            # 3. Run database migrations (applies any new schema changes)
            npx prisma migrate deploy

            # 4. Restart the application service
            sudo systemctl daemon-reload
            sudo systemctl restart galleries_manager.service
            sudo systemctl status galleries_manager.service --no-pager
          EOF

      # Next: deploy frontend and set up Caddy.
